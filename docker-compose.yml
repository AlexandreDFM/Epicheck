# Production-like local stack: the image used by Kubernetes, run as its two
# processes (proxy, and web sharing the proxy's network like a pod).
#   docker compose up --build    then open http://localhost:8080
services:
  proxy:
    build: .
    image: epicheck:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      # nginx is the only reverse proxy in front of it here
      - TRUST_PROXY=1
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: epicheck:local
    pull_policy: never
    restart: unless-stopped
    command: ["nginx", "-e", "stderr", "-g", "daemon off;"]
    network_mode: "service:proxy"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - proxy
