packages:
    - apps/*
    # Former React Native project, kept locally (not versioned) until it
    # becomes a submodule
    - "!apps/old"

# Install scripts allowed to run (pnpm 11 blocks them by default).
# unrs-resolver (ESLint import resolver) ships prebuilt binaries; its
# postinstall only checks them, so it does not need to run.
allowBuilds:
    unrs-resolver: false

# Security fixes for transitive dependencies (Expo CLI, Metro, ESLint,
# Tailwind), pinned to the latest patch of the major line already in use so
# that no tool gets an incompatible version. Advisories that need a new major
# (glob 13, minimatch 10 under glob, uuid 7, image-size 1) are left as is:
# they only concern the build tools, not the app bundle. Remove an entry once
# the parent package depends on a fixed version.
overrides:
    "@babel/core@^7": ^7.29.13
    "@humanfs/node@~0.16": ~0.16.8
    "@xmldom/xmldom@~0.8": ~0.8.15
    ajv@^6: ^6.15.0
    baseline-browser-mapping@^2: ^2.11.39
    brace-expansion@^1: ^1.1.22
    brace-expansion@^2: ^2.1.8
    browserslist@^4: ^4.29.6
    compression@^1: ^1.8.2
    flatted@^3: ^3.4.4
    js-yaml@^3: ^3.15.2
    js-yaml@^4: ^4.3.2
    minimatch@^3: ^3.1.5
    minimatch@^9: ^9.0.9
    minimatch@^10: ^10.2.6
    nanoid@^3: ^3.3.20
    node-forge@^1: ^1.4.4
    picomatch@^2: ^2.3.2
    picomatch@^4: ^4.0.7
    postcss@^8: ^8.5.33
    postcss-selector-parser@^6: ^6.1.6
    proxy-addr@^2: ^2.0.8
    shell-quote@^1: ^1.12.0
    source-map-js@^1: ^1.2.4
    tar@^7: ^7.5.23
    undici@^6: ^6.29.1
    ws@^6: ^6.2.7
    ws@^7: ^7.5.14
    ws@^8: ^8.23.0
    yaml@^2: ^2.9.1
