# Traefik middlewares, referenced by the Ingress annotations as
# <namespace>-<name>@kubernetescrd. The page security headers (CSP...) are
# set by nginx in the image (docker/nginx/security-headers.inc); only HSTS,
# which belongs to the HTTPS endpoint, is added here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    app.kubernetes.io/name: epicheck
    app.kubernetes.io/component: web
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    app.kubernetes.io/name: epicheck
    app.kubernetes.io/component: web
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    forceSTSHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  labels:
    app.kubernetes.io/name: epicheck
    app.kubernetes.io/component: web
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 50
