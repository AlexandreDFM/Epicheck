# EpiCheck web: Expo web export, /api proxied to the CORS proxy.
# TLS ends at the Kubernetes ingress (Traefik); HSTS is set there.
server {
    # Unprivileged port: the container does not run as root
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx itself (probes); /api/health checks the proxy
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Single-page app: unknown paths serve index.html, never cached so that
    # a new deployment is picked up at once
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    # Bundles and assets have a content hash in their name
    location ~ ^/(_expo|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    # CORS proxy, in the other container of the pod (same network namespace)
    location /api/ {
        # The proxy logs its requests itself (without the cookie)
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The proxy waits 15 s for the Intranet
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 100k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
