name: Build and push the image

# main deploys production, develop deploys preprod. The deploy is a reusable
# workflow (workflow_call): workflow_run would only ever run main's version.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/epicheck

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  image:
    name: Build and push the image
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: App version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # linux/amd64,linux/arm64 for ARM nodes (repository variable)
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          # latest only follows main; deployments always use the commit SHA
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    needs: [image]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: production
      namespace: epicheck-prod
      manifests: k8s/production
      prefix: PRD
    secrets: inherit

  deploy-preprod:
    name: Deploy preprod
    if: github.ref == 'refs/heads/develop'
    needs: [image]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: preprod
      namespace: epicheck-preprod
      manifests: k8s/preprod
      prefix: PPD
    secrets: inherit
