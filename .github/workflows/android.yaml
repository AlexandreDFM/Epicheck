name: Android

# Release APK and AAB of the mobile app (the web image is built by build.yaml).
# - tag vX.Y.Z: build, then attach EpiCheck-X.Y.Z.apk/.aab to a GitHub release
# - manual run (Actions tab), or a pull request touching the native config
# Signing: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (docs/BUILD_APK.md). Without them
# the build uses the debug key and no release is published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - app.json
      - app.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/android.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the APK and AAB
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: App version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release tag must match package.json (single source of the version)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Gradle and its caches (the Android SDK is preinstalled on the runner)
      - uses: gradle/actions/setup-gradle@v6

      - name: Generate the native project
        env:
          CI: "1"
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cat android.gradle.properties.template >> android/gradle.properties

      - name: Release key
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signed with the debug key, no release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect the files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/EpiCheck-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/EpiCheck-$VERSION.aab"
          (cd out && sha256sum -- *.apk *.aab > SHA256SUMS)
          cat out/SHA256SUMS
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: EpiCheck-${{ steps.version.outputs.version }}
          path: out/
          retention-days: 30

  release:
    name: GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Section "## [X.Y.Z] - date" up to the next "## [" heading
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: EpiCheck-${{ needs.build.outputs.version }}
          path: out
      - uses: softprops/action-gh-release@v3
        with:
          name: EpiCheck ${{ needs.build.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*
