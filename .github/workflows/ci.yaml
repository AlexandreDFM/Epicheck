name: CI

# Pull requests, and before every image build (reused by build.yaml)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: App (types, lint, Expo dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version from the packageManager field of package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      # Native module versions must match the Expo SDK
      - run: pnpm exec expo install --check
      # Build tools still carry advisories that need a major update of their
      # parent (UPDATE.md); fail on critical ones only
      - run: pnpm audit --prod --audit-level critical

  proxy:
    name: Proxy (types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-server
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: proxy-server/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: proxy-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm audit --prod
