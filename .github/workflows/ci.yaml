name: CI

# Pull requests, and before every image build (reused by build.yaml)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (types, lint, Expo dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version from the packageManager field of the root package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mobile...
      - run: pnpm --filter mobile run typecheck
      - run: pnpm --filter mobile run lint
      # Native module versions must match the Expo SDK
      - run: pnpm --filter mobile exec expo install --check
      # Build tools still carry advisories that need a major update of their
      # parent (CHANGELOG 1.2.1); fail on critical ones only
      - run: (pnpm audit --prod --json || true) | node scripts/ci/audit.mjs mobile critical

  proxy:
    name: Proxy (types, lint, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter proxy...
      - run: pnpm --filter proxy run typecheck
      - run: pnpm --filter proxy run lint
      - run: pnpm --filter proxy test
      - run: (pnpm audit --prod --json || true) | node scripts/ci/audit.mjs proxy moderate
