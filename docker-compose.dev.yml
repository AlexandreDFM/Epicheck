# Development: Expo web dev server and the proxy with reload, from the
# sources (no image to build). On the host, `pnpm web` and `pnpm proxy` do
# the same without Docker.
#   docker compose -f docker-compose.dev.yml up    then open http://localhost:8081
services:
  app:
    image: node:22.21-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec expo start --web --port 8081"
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_PROXY_URL=http://localhost:3001/api/intra-proxy
      - CI=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.expo
    depends_on:
      - proxy

  proxy:
    image: node:22.21-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:8081
    volumes:
      - ./proxy-server:/app
      - /app/node_modules
